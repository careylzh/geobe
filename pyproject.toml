[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geobe"
version = "0.1.0"
description = "A geometric esoteric language interpreter."
readme = "PROMPT.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Geobe Contributors" },
]
keywords = ["esolang", "interpreter", "geometry", "spatial-programming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
geobe = "geobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geobe"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "RUF",
]
